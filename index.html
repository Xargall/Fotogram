<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>

    <link
      rel="shortcut icon"
      href="./assets/icons/Group.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="standard.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fonts.css" />
  </head>

  <body onload="init()">

      <section class="landing">

    </dialog>
    <!-- <div onclick="closeDetail()" id="preview" class="d_none"></div> -->
    <footer class="footer">
      <img src="./assets/icons/Frame 6.png" alt="" />
    </footer>
    <script src="script.js"></script>

</html>
